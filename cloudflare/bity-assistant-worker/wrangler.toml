name = "assistant"
main = "worker.js"
compatibility_date = "2024-12-01"

[vars]
OPENAI_CHAT_MODEL = "gpt-6-astra"
OPENAI_VISION_MODEL = "gpt-6-astra"

[[durable_objects.bindings]]
name = "SPOONACULAR_GATE"
class_name = "SpoonacularGate"

[[durable_objects.bindings]]
name = "RECIPE_IMAGES"
class_name = "RecipeImageStore"

[[migrations]]
tag = "v1-spoonacular-gate"
new_classes = ["SpoonacularGate"]

[[migrations]]
tag = "v2-recipe-images"
new_classes = ["RecipeImageStore"]

[[r2_buckets]]
binding = "BITY_BUCKET"
bucket_name = "bity"
